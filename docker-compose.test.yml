# Mediu de TEST, pornit permanent lângă producție pe aceeași mașină.
#
# Nu împarte nimic cu producția: alt proiect compose (`name:`), alte volume,
# alte porturi, altă bază de date. Producția rămâne pe 5959 (web) / 3000 (API);
# aici totul e mutat sus, ca să nu existe nicio suprapunere:
#
#   web  http://localhost:5961
#   API  http://localhost:3999
#   db   localhost:55433
#   s3   localhost:59000
#
# Pornire:   docker compose -f docker-compose.test.yml --env-file .env.test up -d
# Oprire:    docker compose -f docker-compose.test.yml down
# Reset DB:  docker compose -f docker-compose.test.yml down -v   (șterge volumele)
#
# `restart: unless-stopped` peste tot: mediul supraviețuiește unui reboot al
# mașinii, exact ca producția, fără să fie repornit de mână.
#
# Web-ul e un build STATIC (frontend/build/web-test), nu `flutter run`: acela e
# un proces care ține de sesiunea din care a fost pornit și moare cu ea.
# Bundle-ul se reface cu:
#   flutter build web -o build/web-test --dart-define=API_BASE_URL=http://localhost:3999
# `-o build/web-test` e obligatoriu - `build/web` e ce servește producția pe
# 5959, iar un build cu API-ul de test acolo ar rupe site-ul real până la
# următorul deploy.

name: shelfshare-test

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:59000:9000"
    volumes:
      - minio_test_data:/data
    command: server /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env.test
    ports:
      - "127.0.0.1:3999:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Migrările se aplică la fiecare pornire: pe mediul de test asta e exact
    # ce vrem - o migrare nouă e încercată aici înainte să atingă producția.
    # `rm -f ...tsbuildinfo`: nest-cli are `deleteOutDir: true`, deci sterge
    # `dist/` la fiecare pornire, dar informatia de build incrementala e
    # persistenta pe bind mount-ul de mai sus. Impreuna dau un dist GOL -
    # tsc crede ca nu are ce reemite - si containerul moare cu
    # „Cannot find module /app/dist/main". Stergerea forteaza o compilare
    # completa la fiecare pornire.
    command: sh -c "rm -f tsconfig.build.tsbuildinfo && pnpm exec prisma generate && pnpm exec prisma migrate deploy && pnpm run start:dev"

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5961:80"
    volumes:
      - ./frontend/build/web-test:/usr/share/nginx/html:ro
      - ./scripts/test-web-nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_test_data:
  minio_test_data:
