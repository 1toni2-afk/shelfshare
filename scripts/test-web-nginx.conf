# Nginx pentru web-ul din mediul de test (docker-compose.test.yml).
#
# Singurul lucru care nu e implicit: `try_files ... /index.html`. Aplicația e
# un SPA cu rute proprii (/library/add, /book-requests...), iar un refresh pe
# oricare din ele ar cere serverului un fișier care nu există. Fără linia asta
# ar da 404 exact la testul cel mai frecvent - reîncărcarea paginii curente.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Mediu de test: nu vrem să depanăm o oră o schimbare care e de fapt în
    # cache-ul browserului. Vezi și memoria despre /assets/ - numele fișierelor
    # Flutter nu sunt hash-uite pe conținut, deci „immutable" ar fi o capcană.
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
