# Nginx pentru web-ul din mediul de test (docker-compose.test.yml).
#
# Doua lucruri care nu sunt implicite:
#
# 1. `try_files ... /index.html`. Aplicatia e un SPA cu rute proprii
#    (/library/add, /book-requests...), iar un refresh pe oricare din ele ar
#    cere serverului un fisier care nu exista. Fara linia asta ar da 404 exact
#    la testul cel mai frecvent - reincarcarea paginii curente.
#
# 2. `location /api/`. Backend-ul de test e legat pe 127.0.0.1:3999, deci e
#    accesibil DOAR de pe masina gazda. Cand deschizi testul de pe alt device
#    (telefon prin Tailscale), un bundle compilat cu API_BASE_URL=localhost:3999
#    lovea telefonul insusi si toate requesturile picau. Proxy-ul de aici pune
#    API-ul pe aceeasi origine cu web-ul, deci merge de oriunde se vede
#    portul 5961 - build-ul se face cu --dart-define=API_BASE_URL=/api.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Mediu de test: nu vrem să depanăm o oră o schimbare care e de fapt în
    # cache-ul browserului. Vezi și memoria despre /assets/ - numele fișierelor
    # Flutter nu sunt hash-uite pe conținut, deci „immutable" ar fi o capcană.
    add_header Cache-Control "no-store" always;

    # Upload-urile de coperti trec pe aici, iar 1MB (default-ul nginx) le taia
    # cu 413 inainte sa ajunga la backend.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat-ul foloseste websockets; fara astea conexiunea cade la upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
