apply plugin: 'com.android.application'

/*
  Cheia de semnare e ACEEAȘI cu a aplicației Flutter (frontend/android/).

  Google Play leagă o aplicație de certificatul cu care a fost semnată prima
  oară. Semnată cu altă cheie, aceeași aplicație e refuzată la încărcare - nu
  ca eroare de configurare, ci ca „nu ești tu". De aceea nu generăm o cheie
  nouă aici, ci o citim pe cea existentă, din același `key.properties`.

  Dacă fișierul lipsește (de exemplu pe o mașină de CI fără secrete), cădem pe
  cheia de debug: build-ul trece, dar rezultatul nu poate fi urcat pe Play -
  exact ca în build.gradle.kts din proiectul Flutter.
*/
def flutterAndroidDir = file('../../../frontend/android')
def keystorePropertiesFile = new File(flutterAndroidDir, 'key.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Versiunea vine din web/package.json - vezi defaultConfig mai jos.
def webPackage = new groovy.json.JsonSlurper().parse(file('../../package.json'))
if (!(webPackage.version instanceof String) || !(webPackage.versionCode instanceof Integer)) {
    throw new GradleException("web/package.json trebuie sa aiba `version` (text) si `versionCode` (numar intreg).")
}

android {
    namespace = "ro.shelfshare.shelfshare"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ro.shelfshare.shelfshare"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Din web/package.json (`version` + `versionCode`), singura sursă a
        // versiunii: aceeași valoare apare în Setări (__APP_VERSION__ din
        // vite.config.ts) și ajunge în pubspec.yaml prin `npm run bump`.
        // Play cere un versionCode STRICT mai mare decât orice a fost urcat
        // vreodată, iar aplicația Flutter împarte același slot pe Play.
        versionCode webPackage.versionCode as int
        versionName webPackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile new File(flutterAndroidDir, keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
