services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Nu expunem portul 5432 în exterior - doar backend-ul îl accesează, prin rețeaua internă Docker.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Portul 9000 e expus pe host pentru ca tunelul Cloudflare
    # (storage.shelfshare.ro -> http://localhost:9000) îl accesează direct,
    # din afara rețelei Docker.
    #
    # Legat explicit la 127.0.0.1: `"9000:9000"` asculta pe TOATE interfețele,
    # iar publicarea de porturi Docker scrie direct în lanțul iptables DOCKER,
    # deci ocolește firewall-ul host-ului - MinIO era accesibil direct din
    # rețea, sărind peste Cloudflare. Tunelul rulează pe host, deci loopback
    # îi este suficient.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      # Aplicația stă în spatele Cloudflare Tunnel, deci trebuie să citească
      # IP-ul clientului din header, nu din socket - altfel rate-limiting-ul
      # și jurnalul de securitate văd o singură adresă pentru toți userii
      # (vezi backend/src/common/utils/client-ip.ts). Sigur de activat doar
      # pentru că portul e legat la loopback mai sus: nimeni nu poate ajunge
      # la aplicație ocolind tunelul ca să-și fabrice singur header-ul.
      TRUST_PROXY: "true"
      # Jurnalul global (interacțiuni user-user și user-admin, plus mesajele
      # într-un fișier separat) - vezi backend/src/activity-log. Scris pe
      # host prin bind mount, ca să supraviețuiască rebuild-urilor de imagine.
      ACTIVITY_LOG_DIR: /app/logs
      # Push notifications (Firebase Cloud Messaging). Ajunge oricum prin
      # env_file de mai sus; e trecuta si aici explicit ca sa fie vizibila
      # printre variabilele de care depinde serviciul. Nesetata, PushService
      # logheaza un warning si devine no-op - clopotelul si socket-ul merg mai
      # departe, doar push-ul catre telefon lipseste. Vezi .env.example pentru
      # formatul JSON pe un singur rand si pentru fisierele de client.
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    volumes:
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "node_modules/.bin/prisma migrate deploy && node dist/main"
    # Portul 3000 e expus pe host pentru ca tunelul Cloudflare
    # (api.shelfshare.ro -> http://localhost:3000) îl accesează direct,
    # din afara rețelei Docker - Nginx Proxy Manager de mai jos nu e folosit
    # de fapt (routarea reală se face prin Cloudflare Tunnel).

  # Backup zilnic al bazei de date și al fișierelor urcate (vezi scripts/backup.sh).
  # Folosim imaginea de postgres fiindcă aduce deja `pg_dump` de versiunea
  # potrivită - un dump făcut cu un client mai vechi decât serverul eșuează.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Câte generații se păstrează pe discul extern (numărate, nu pe zile).
      BACKUP_EXTERNAL_KEEP: ${BACKUP_EXTERNAL_KEEP:-10}
      # Parola cu care se criptează dump-ul (vezi scripts/backup.sh). Fără ea,
      # backup-ul conține în clar toată tabela User - emailuri, nume, hash-uri
      # de parolă - iar o copie ajunge pe un HDD extern, unde e suficient să
      # se piardă discul. Scriptul refuză să ruleze dacă lipsește.
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      # Portiță explicită, doar pentru cazuri în care chiar vrei dump necriptat
      # (ex. restaurare locală de test). Lăsată nesetată în funcționare normală.
      BACKUP_ALLOW_UNENCRYPTED: ${BACKUP_ALLOW_UNENCRYPTED:-false}
      # Fără asta containerul merge pe UTC, iar „03:15" din crontab ar cădea la
      # 06:15 ora României. Cu TZ setat, ora din crontab e chiar ora locală.
      TZ: Europe/Bucharest
    volumes:
      - ./scripts:/scripts:ro
      # Read-only: procesul de backup nu are niciun motiv să poată scrie în
      # datele live. Dacă scriptul o ia razna, nu poate distruge originalul.
      - minio_data:/minio-data:ro
      - backups_data:/backups
      # Copie pe un disc fizic separat: volumul de mai sus stă pe același disc
      # ca baza de date, deci nu ajută la o defecțiune de disc. Calea are spațiu
      # în nume, de aceea toată maparea e între ghilimele.
      - "E:/Backup ShelfShare:/backups-external"
    depends_on:
      postgres:
        condition: service_healthy
    # crond din busybox, în prim-plan (-f), la 03:15 ora locală (vezi TZ).
    #
    # Redirectarea către /proc/1/fd/1 e stdout-ul procesului crond, adică
    # stdout-ul containerului: fără ea, busybox crond ar încerca să trimită
    # ieșirea job-ului prin mail și, în lipsa unui sendmail, ar arunca-o.
    # `docker logs backup` ar arăta doar că job-ul a pornit, nu ce a făcut -
    # exact genul de eșec pe care nu l-ai observa decât când ai nevoie de un
    # backup care nu există.
    # `apk add gnupg` la pornire: imaginea postgres:16-alpine aduce pg_dump,
    # dar nu și gpg, de care scriptul are nevoie ca să cripteze dump-ul.
    command: >
      sh -c "apk add --no-cache gnupg &&
             echo '15 3 * * * /scripts/backup.sh >> /proc/1/fd/1 2>&1' > /etc/crontabs/root &&
             crond -f -d 8"

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"   # UI de administrare NPM - accesează http://IP-NUC:81 (schimbă parola default la prima logare!)
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  minio_data:
  backups_data:
  npm_data:
  npm_letsencrypt:
