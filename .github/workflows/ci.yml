name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalează dependențe
        run: pnpm install --frozen-lockfile

      - name: Generează Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Lint
        run: pnpm run lint

      - name: Teste
        run: pnpm test

      - name: Build
        run: pnpm run build

  frontend-check:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalează dependențe
        run: flutter pub get

      - name: Analiză statică
        run: flutter analyze

      - name: Teste
        run: flutter test

  # Deploy automat, doar la push direct pe main (nu la PR) - runnerele
  # self-hosted rulează pe mașinile reale (NUC / mașina cu static-server),
  # deci scripturile de deploy scriu direct peste instalarea live.
  # Fiecare job rulează pe clona persistentă existentă pe acea mașină (calea
  # vine din variabilele de repo NUC_DEPLOY_PATH / WEB_DEPLOY_PATH - vezi
  # Settings > Secrets and variables > Actions > Variables), nu pe un
  # checkout proaspăt al runner-ului: scripturile de deploy fac ele
  # `git pull`, iar clona persistentă e cea cu `.env`-ul real și volumele
  # Docker deja legate.
  deploy-backend:
    needs: [backend-check, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, nuc]
    steps:
      - name: Deploy backend pe NUC
        working-directory: ${{ vars.NUC_DEPLOY_PATH }}
        run: ./scripts/deploy.sh

  deploy-web:
    needs: [backend-check, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, web]
    steps:
      - name: Deploy frontend web
        shell: pwsh
        working-directory: ${{ vars.WEB_DEPLOY_PATH }}
        run: ./scripts/deploy-web.ps1 -Pull -ApiBaseUrl https://api.shelfshare.ro
