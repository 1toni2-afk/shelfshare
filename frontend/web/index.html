<!DOCTYPE html>
<html lang="ro">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Fără cache pentru HTML: bundle-urile Flutter au filename hash-uit și pot
       fi cache-uite eternic, dar index.html trebuie mereu să vină de la server
       ca să pointeze spre bundle-ul curent. Fără asta, browserul (și
       Cloudflare) pot servi un index.html vechi care încarcă bundle-ul vechi
       - efectul e „am dat refresh și tot văd bug-ul reparat". -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Google Analytics (GA4) - încărcat DOAR după consimțământ explicit.
       Înainte, gtag.js pornea necondiționat aici, în <head>: pune cookie-uri
       și trimite un page_view către Google din prima milisecundă, adică
       înainte ca userul să fi putut spune ceva. Sub GDPR + directiva
       ePrivacy, analytics-ul cu cookie-uri are nevoie de consimțământ
       PRECEDENT, iar politica noastră de confidențialitate declară exact
       asta ca temei (vezi secțiunea 5 din scripts/static-pages/privacy.html).
       Acum nu se face nicio cerere către googletagmanager.com până când
       bannerul din <body> nu primește un „Accept" - vezi loadAnalytics()
       acolo. Un refuz, sau lipsa unei alegeri, înseamnă zero trafic spre
       Google. Doar web: pe Android/iOS nu există GA în aplicație. -->

  <meta name="description" content="ShelfShare - schimbă, vinde sau cumpără cărți second-hand de la alți cititori din România.">
  <meta name="theme-color" content="#7C3A1E">
  <link rel="canonical" href="https://shelfshare.ro/">

  <!-- Open Graph / previzualizare la distribuirea linkului (WhatsApp, Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shelfshare.ro">
  <meta property="og:site_name" content="ShelfShare">
  <meta property="og:title" content="ShelfShare">
  <meta property="og:description" content="Schimbă, vinde sau cumpără cărți second-hand de la alți cititori din România.">
  <meta property="og:image" content="https://shelfshare.ro/icons/Icon-512.png">
  <meta property="og:locale" content="ro_RO">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ShelfShare">
  <meta name="twitter:description" content="Schimbă, vinde sau cumpără cărți second-hand de la alți cititori din România.">
  <meta name="twitter:image" content="https://shelfshare.ro/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ShelfShare">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ShelfShare</title>
  <link rel="manifest" href="manifest.json">

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ShelfShare",
    "url": "https://shelfshare.ro",
    "logo": "https://shelfshare.ro/icons/Icon-512.png",
    "description": "Schimbă, vinde sau cumpără cărți second-hand de la alți cititori din România."
  }
  </script>

  <style>
    /* Fundalul paginii HTML e alb implicit. Pe mobil, când tastatura se
       închide, engine-ul Flutter web uneori nu-și redimensionează view-ul
       înapoi la înălțimea completă suficient de repede (bug cunoscut,
       specific mobile Chrome) - golul rămas expune fundalul alb al paginii
       de dedesubt, un dreptunghi orbitor pe o temă întunecată. Nu rezolvă
       cauza (vezi și scriptul de resize de mai jos), dar dacă tot apare
       golul, măcar se vede în culoarea temei, nu alb.
       #0E0E0F = AppColors._darkBackground din app_theme.dart. */
    html, body {
      background: #0E0E0F;
      height: 100%;
    }
    /* Placeholder afișat instant de browser, înainte ca JS-ul Flutter să
       apuce să se descarce/parseze - fără el, userul vede o pagină complet
       albă câteva secunde la fiecare încărcare. Eliminat explicit la evenimentul
       "flutter-first-frame" (vezi scriptul de mai jos) - un z-index atât de
       mare nu e garantat acoperit automat de canvas-ul Flutter. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F4EC;
      z-index: 9999;
    }
    #splash .splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #splash .splash-ring-wrap {
      position: relative;
      width: 72px;
      height: 72px;
    }
    /* Rotit -90deg ca arcul să pornească de la ora 12, nu de la ora 3
       (poziția implicită SVG pentru un <circle>). */
    #splash .splash-ring {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    #splash .splash-ring-bg {
      fill: none;
      stroke: #EDE8DE;
      stroke-width: 5;
    }
    #splash .splash-ring-fg {
      fill: none;
      stroke: #C8783A;
      stroke-width: 5;
      stroke-linecap: round;
      /* stroke-dasharray/dashoffset setate din JS, în funcție de procent -
         circumferința cercului (r=32) e 2*pi*32 ≈ 201.06. */
      stroke-dasharray: 201.06;
      stroke-dashoffset: 201.06;
      transition: stroke-dashoffset 0.15s linear;
    }
    #splash .splash-percent {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #3A2A1E;
    }
    #splash .splash-stage {
      font-family: sans-serif;
      font-size: 13px;
      color: #8A7A68;
      min-height: 16px;
    }
    /* Splash-ul avea doar paleta light (fundal crem) - noaptea, sau cu
       tema device-ului pe dark, ecranul alb-crem orbea userul pentru cele
       ~1-2s cât se încarcă bundle-ul. Urmează tema browserului/OS-ului
       (nu tema aleasă în aplicație - aia nu există încă la acest punct,
       Flutter nici n-a pornit). Culorile de mai jos oglindesc paleta dark
       din app_theme.dart (fundal #0E0E0F, ca html/body de mai sus). */
    @media (prefers-color-scheme: dark) {
      #splash {
        background: #0E0E0F;
      }
      #splash .splash-ring-bg {
        stroke: #2A2A2C;
      }
      #splash .splash-percent {
        color: #F2ECE2;
      }
      #splash .splash-stage {
        color: #A69A8C;
      }
    }
    /* Conținut randat server-side (vezi scripts/static-server.js) pentru
       cartea/profilul cerut, ca paginile /books/:id și /users/:id să aibă
       text real indexabil - fără el, Googlebot nu vede decât <title>/<meta>,
       body-ul fiind gol până randează Flutter în canvas. Rămâne acoperit de
       #splash (fixed, opac, z-index mai mare) cât timp aplicația se
       încarcă, deci userii reali nu-l văd niciodată - eliminat la
       "flutter-first-frame" ca și #splash. Stilat minimal doar ca plasă de
       siguranță pentru cazul (rar) în care JS-ul Flutter nu pornește deloc. */
    #seo-content {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px;
      font-family: sans-serif;
      color: #1a1a1a;
    }
    #seo-content img {
      max-width: 100%;
      height: auto;
    }
    /* Bannerul de consimțământ pentru analytics. Stă peste tot (inclusiv
       peste canvas-ul Flutter), dar sub #splash: se arată abia după ce
       aplicația a randat primul frame, ca să nu concureze cu ecranul de
       încărcare. Culorile oglindesc paleta din app_theme.dart, cu varianta
       dark după tema browserului - Flutter n-a pornit încă neapărat, deci
       nu putem citi tema aleasă în aplicație. */
    #cookie-consent {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 9998;
      margin: 0 auto;
      max-width: 560px;
      background: #FDFAF4;
      color: #2A1A0E;
      border: 1px solid rgba(42, 26, 14, 0.13);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      padding: 18px 20px;
      font-family: sans-serif;
    }
    #cookie-consent p {
      margin: 0 0 14px;
      font-size: 14px;
      line-height: 1.5;
    }
    #cookie-consent a {
      color: #C8783A;
    }
    #cookie-consent .cc-actions {
      display: flex;
      gap: 10px;
    }
    /* Aceeași dimensiune și greutate pentru ambele butoane: GDPR cere ca
       refuzul să fie la fel de ușor ca acceptul, nu un link șters pe lângă
       un buton colorat. */
    #cookie-consent button {
      flex: 1;
      padding: 11px 16px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    #cookie-consent .cc-accept {
      background: #7C3A1E;
      color: #FDF9F3;
      border: 1px solid #7C3A1E;
    }
    #cookie-consent .cc-reject {
      background: transparent;
      color: inherit;
      border: 1px solid rgba(42, 26, 14, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      #cookie-consent {
        background: #19191B;
        color: #F5F3F0;
        border-color: rgba(255, 255, 255, 0.12);
      }
      #cookie-consent .cc-reject {
        border-color: rgba(255, 255, 255, 0.35);
      }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-inner">
      <div class="splash-ring-wrap">
        <svg class="splash-ring" viewBox="0 0 72 72">
          <circle class="splash-ring-bg" cx="36" cy="36" r="32"></circle>
          <circle class="splash-ring-fg" id="splash-ring-fg" cx="36" cy="36" r="32"></circle>
        </svg>
        <div class="splash-percent" id="splash-percent">0%</div>
      </div>
      <div class="splash-stage" id="splash-stage">Se încarcă aplicația…</div>
    </div>
  </div>
  <script>
    // Flutter trimite acest eveniment pe window imediat după primul frame
    // randat - fără eliminarea explicită, splash-ul (z-index mare, fixed)
    // ar putea rămâne deasupra aplicației la nesfârșit, chiar dacă aceasta
    // s-a încărcat corect dedesubt. Timeout-ul e doar o plasă de siguranță,
    // ca un splash să nu blocheze accesul la aplicație dacă evenimentul nu
    // ajunge să se declanșeze din vreun motiv neprevăzut.
    // NU încerca să pornești aici semantica pentru autofill. Pe web, Flutter
    // randează câmpurile în canvas și creează <input>-uri reale în DOM doar cu
    // arborele de semantică activ, iar fără ele managerul de parole din Chrome
    // nu vede formularul de login. Dar:
    //   - SemanticsBinding.ensureSemantics() pornește doar partea de framework;
    //     engine-ul aruncă arborele (verificat: 0 noduri <flt-semantics>);
    //   - un click programatic pe <flt-semantics-placeholder> îl șterge din
    //     pagină FĂRĂ să pornească semantica, adică strică butonul de care au
    //     nevoie userii cu cititor de ecran, fără să rezolve autofill-ul.
    // Engine-ul nu expune niciun API public pentru asta. Pe Android/iOS
    // autofill-ul funcționează normal (AutofillGroup + autofillHints +
    // TextInput.finishAutofillContext, vezi login_screen.dart).
    // Procentul 0-100% de pe splash e o SIMULARE (nu progres real de bytes
    // descărcați) - Flutter web nu expune un semnal fin-grained de progres
    // pentru încărcarea bundle-ului fără să rescriem manual loader-ul.
    // (Loader-ul E personalizabil, prin șablonul web/flutter_bootstrap.js -
    // vezi acolo canvaskitBaseUrl - dar tot nu primim procente reale de la
    // engine.) Se apropie
    // asimptotic de 92% cât timp așteaptă, ca userul să nu vadă niciodată
    // 100% înainte ca aplicația chiar să fie gata - finalizarea reală tot
    // vine din "flutter-first-frame" / timeout, ca înainte, neschimbat.
    (function () {
      var percentEl = document.getElementById('splash-percent');
      var stageEl = document.getElementById('splash-stage');
      var ringFg = document.getElementById('splash-ring-fg');
      var circumference = 201.06;
      var current = 0;
      var done = false;

      function setPercent(p) {
        current = p;
        if (percentEl) percentEl.textContent = Math.round(p) + '%';
        if (ringFg) ringFg.style.strokeDashoffset = String(circumference * (1 - p / 100));
        if (stageEl) {
          stageEl.textContent = p < 30
            ? 'Se încarcă aplicația…'
            : p < 70
              ? 'Se pregătesc resursele…'
              : 'Aproape gata…';
        }
      }

      var tickInterval = setInterval(function () {
        if (done) return;
        // Pas care scade pe măsură ce ne apropiem de plafonul de 92% -
        // rapid la început, tot mai lent spre final (curbă ease-out).
        var step = Math.max(0.15, (92 - current) * 0.06);
        setPercent(Math.min(92, current + step));
      }, 60);

      window._splashFinish = function () {
        if (done) return;
        done = true;
        clearInterval(tickInterval);
        setPercent(100);
      };
    })();

    window.addEventListener('flutter-first-frame', function () {
      window._splashFinish && window._splashFinish();
      // Scurtă pauză ca userul să apuce să vadă 100% înainte ca splash-ul
      // să dispară - altfel sare direct de la ~92% la nimic.
      setTimeout(function () {
        document.getElementById('splash')?.remove();
        document.getElementById('seo-content')?.remove();
      }, 150);
    });
    setTimeout(function () {
      window._splashFinish && window._splashFinish();
      document.getElementById('splash')?.remove();
      document.getElementById('seo-content')?.remove();
    }, 15000);

    // Dezînregistrăm orice service worker Flutter deja instalat și golim
    // cache-urile lui. Am avut două runde de bug-uri unde o versiune veche
    // rămânea servită din cache după ce am publicat un fix - inclusiv în
    // incognito, dacă exista o altă fereastră incognito activă. Aplicația
    // nu depinde de service worker pentru funcționare (nu avem mod offline);
    // costul e neglijabil, câștigul e că un release nou intră imediat.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (const r of regs) r.unregister();
      });
      if (typeof caches !== 'undefined') {
        caches.keys().then(function (keys) {
          for (const k of keys) caches.delete(k);
        });
      }
    }
  </script>

  <script>
    // Consimțământ pentru Google Analytics. Regula: nicio cerere către
    // Google până când userul nu apasă explicit „Accept". Refuzul și lipsa
    // unei alegeri se comportă identic din punctul de vedere al traficului
    // (zero), diferă doar prin faptul că un refuz nu mai reafișează
    // bannerul.
    //
    // Alegerea stă în localStorage, nu într-un cookie: e per-browser, nu se
    // trimite la fiecare cerere și nu are nevoie ea însăși de consimțământ,
    // fiind strict necesară pentru a onora o preferință exprimată de user.
    (function () {
      var KEY = 'ss-analytics-consent';
      var GA_ID = 'G-36HN8BM30V';
      var stored = null;
      // Poate arunca în modul privat al unor browsere sau cu cookie-urile
      // blocate de tot; atunci ne comportăm ca și cum n-ar exista o alegere.
      try { stored = localStorage.getItem(KEY); } catch (e) {}

      function loadAnalytics() {
        if (window.__ssAnalyticsLoaded) return;
        window.__ssAnalyticsLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', GA_ID);
      }

      function remember(value) {
        try { localStorage.setItem(KEY, value); } catch (e) {}
      }

      function showBanner() {
        var el = document.createElement('div');
        el.id = 'cookie-consent';
        el.setAttribute('role', 'dialog');
        el.setAttribute('aria-live', 'polite');
        el.setAttribute('aria-label', 'Consimțământ pentru statistici');
        el.innerHTML =
          '<p>Folosim Google Analytics ca să vedem câți oameni intră pe site. ' +
          'Nu pornește nimic până nu accepți, iar refuzul nu schimbă cu nimic ' +
          'felul în care funcționează aplicația. ' +
          '<a href="/privacy">Detalii în politica de confidențialitate</a>.</p>' +
          '<div class="cc-actions">' +
          '<button type="button" class="cc-reject">Refuz</button>' +
          '<button type="button" class="cc-accept">Accept</button>' +
          '</div>';
        document.body.appendChild(el);
        el.querySelector('.cc-accept').addEventListener('click', function () {
          remember('granted');
          el.remove();
          loadAnalytics();
        });
        el.querySelector('.cc-reject').addEventListener('click', function () {
          remember('denied');
          el.remove();
        });
      }

      if (stored === 'granted') {
        loadAnalytics();
        return;
      }
      if (stored === 'denied') return;

      // Bannerul apare abia după ce dispare splash-ul, ca userul să nu vadă
      // două straturi suprapuse la pornire. Timeout-ul e plasa de siguranță
      // pentru cazul în care „flutter-first-frame" nu se declanșează, ca
      // alegerea să rămână oricum posibilă.
      var shown = false;
      function showOnce() {
        if (shown) return;
        shown = true;
        showBanner();
      }
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(showOnce, 400);
      });
      setTimeout(showOnce, 15500);

      // Retragerea consimțământului: șterge alegerea și reafișează bannerul
      // la următoarea încărcare. Expusă global ca să poată fi apelată de
      // oriunde (consolă, sau un buton din aplicație, dacă se adaugă unul).
      window.shelfShareResetAnalyticsConsent = function () {
        try { localStorage.removeItem(KEY); } catch (e) {}
      };
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
