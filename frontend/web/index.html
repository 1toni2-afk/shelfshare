<!DOCTYPE html>
<html lang="ro">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Fără cache pentru HTML: bundle-urile Flutter au filename hash-uit și pot
       fi cache-uite eternic, dar index.html trebuie mereu să vină de la server
       ca să pointeze spre bundle-ul curent. Fără asta, browserul (și
       Cloudflare) pot servi un index.html vechi care încarcă bundle-ul vechi
       - efectul e „am dat refresh și tot văd bug-ul reparat". -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-36HN8BM30V"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-36HN8BM30V');
  </script>

  <meta name="description" content="ShelfShare - schimbă, vinde sau cumpără cărți second-hand de la alți cititori din România.">
  <meta name="theme-color" content="#7C3A1E">
  <link rel="canonical" href="https://shelfshare.ro/">

  <!-- Open Graph / previzualizare la distribuirea linkului (WhatsApp, Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shelfshare.ro">
  <meta property="og:site_name" content="ShelfShare">
  <meta property="og:title" content="ShelfShare">
  <meta property="og:description" content="Schimbă, vinde sau cumpără cărți second-hand de la alți cititori din România.">
  <meta property="og:image" content="https://shelfshare.ro/icons/Icon-512.png">
  <meta property="og:locale" content="ro_RO">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ShelfShare">
  <meta name="twitter:description" content="Schimbă, vinde sau cumpără cărți second-hand de la alți cititori din România.">
  <meta name="twitter:image" content="https://shelfshare.ro/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ShelfShare">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ShelfShare</title>
  <link rel="manifest" href="manifest.json">

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ShelfShare",
    "url": "https://shelfshare.ro",
    "logo": "https://shelfshare.ro/icons/Icon-512.png",
    "description": "Schimbă, vinde sau cumpără cărți second-hand de la alți cititori din România."
  }
  </script>

  <style>
    /* Fundalul paginii HTML e alb implicit. Pe mobil, când tastatura se
       închide, engine-ul Flutter web uneori nu-și redimensionează view-ul
       înapoi la înălțimea completă suficient de repede (bug cunoscut,
       specific mobile Chrome) - golul rămas expune fundalul alb al paginii
       de dedesubt, un dreptunghi orbitor pe o temă întunecată. Nu rezolvă
       cauza (vezi și scriptul de resize de mai jos), dar dacă tot apare
       golul, măcar se vede în culoarea temei, nu alb.
       #0E0E0F = AppColors._darkBackground din app_theme.dart. */
    html, body {
      background: #0E0E0F;
      height: 100%;
    }
    /* Placeholder afișat instant de browser, înainte ca JS-ul Flutter să
       apuce să se descarce/parseze - fără el, userul vede o pagină complet
       albă câteva secunde la fiecare încărcare. Eliminat explicit la evenimentul
       "flutter-first-frame" (vezi scriptul de mai jos) - un z-index atât de
       mare nu e garantat acoperit automat de canvas-ul Flutter. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F4EC;
      z-index: 9999;
    }
    #splash .splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #splash .splash-ring-wrap {
      position: relative;
      width: 72px;
      height: 72px;
    }
    /* Rotit -90deg ca arcul să pornească de la ora 12, nu de la ora 3
       (poziția implicită SVG pentru un <circle>). */
    #splash .splash-ring {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    #splash .splash-ring-bg {
      fill: none;
      stroke: #EDE8DE;
      stroke-width: 5;
    }
    #splash .splash-ring-fg {
      fill: none;
      stroke: #C8783A;
      stroke-width: 5;
      stroke-linecap: round;
      /* stroke-dasharray/dashoffset setate din JS, în funcție de procent -
         circumferința cercului (r=32) e 2*pi*32 ≈ 201.06. */
      stroke-dasharray: 201.06;
      stroke-dashoffset: 201.06;
      transition: stroke-dashoffset 0.15s linear;
    }
    #splash .splash-percent {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #3A2A1E;
    }
    #splash .splash-stage {
      font-family: sans-serif;
      font-size: 13px;
      color: #8A7A68;
      min-height: 16px;
    }
    /* Splash-ul avea doar paleta light (fundal crem) - noaptea, sau cu
       tema device-ului pe dark, ecranul alb-crem orbea userul pentru cele
       ~1-2s cât se încarcă bundle-ul. Urmează tema browserului/OS-ului
       (nu tema aleasă în aplicație - aia nu există încă la acest punct,
       Flutter nici n-a pornit). Culorile de mai jos oglindesc paleta dark
       din app_theme.dart (fundal #0E0E0F, ca html/body de mai sus). */
    @media (prefers-color-scheme: dark) {
      #splash {
        background: #0E0E0F;
      }
      #splash .splash-ring-bg {
        stroke: #2A2A2C;
      }
      #splash .splash-percent {
        color: #F2ECE2;
      }
      #splash .splash-stage {
        color: #A69A8C;
      }
    }
    /* Conținut randat server-side (vezi scripts/static-server.js) pentru
       cartea/profilul cerut, ca paginile /books/:id și /users/:id să aibă
       text real indexabil - fără el, Googlebot nu vede decât <title>/<meta>,
       body-ul fiind gol până randează Flutter în canvas. Rămâne acoperit de
       #splash (fixed, opac, z-index mai mare) cât timp aplicația se
       încarcă, deci userii reali nu-l văd niciodată - eliminat la
       "flutter-first-frame" ca și #splash. Stilat minimal doar ca plasă de
       siguranță pentru cazul (rar) în care JS-ul Flutter nu pornește deloc. */
    #seo-content {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px;
      font-family: sans-serif;
      color: #1a1a1a;
    }
    #seo-content img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-inner">
      <div class="splash-ring-wrap">
        <svg class="splash-ring" viewBox="0 0 72 72">
          <circle class="splash-ring-bg" cx="36" cy="36" r="32"></circle>
          <circle class="splash-ring-fg" id="splash-ring-fg" cx="36" cy="36" r="32"></circle>
        </svg>
        <div class="splash-percent" id="splash-percent">0%</div>
      </div>
      <div class="splash-stage" id="splash-stage">Se încarcă aplicația…</div>
    </div>
  </div>
  <script>
    // Flutter trimite acest eveniment pe window imediat după primul frame
    // randat - fără eliminarea explicită, splash-ul (z-index mare, fixed)
    // ar putea rămâne deasupra aplicației la nesfârșit, chiar dacă aceasta
    // s-a încărcat corect dedesubt. Timeout-ul e doar o plasă de siguranță,
    // ca un splash să nu blocheze accesul la aplicație dacă evenimentul nu
    // ajunge să se declanșeze din vreun motiv neprevăzut.
    // NU încerca să pornești aici semantica pentru autofill. Pe web, Flutter
    // randează câmpurile în canvas și creează <input>-uri reale în DOM doar cu
    // arborele de semantică activ, iar fără ele managerul de parole din Chrome
    // nu vede formularul de login. Dar:
    //   - SemanticsBinding.ensureSemantics() pornește doar partea de framework;
    //     engine-ul aruncă arborele (verificat: 0 noduri <flt-semantics>);
    //   - un click programatic pe <flt-semantics-placeholder> îl șterge din
    //     pagină FĂRĂ să pornească semantica, adică strică butonul de care au
    //     nevoie userii cu cititor de ecran, fără să rezolve autofill-ul.
    // Engine-ul nu expune niciun API public pentru asta. Pe Android/iOS
    // autofill-ul funcționează normal (AutofillGroup + autofillHints +
    // TextInput.finishAutofillContext, vezi login_screen.dart).
    // Procentul 0-100% de pe splash e o SIMULARE (nu progres real de bytes
    // descărcați) - Flutter web nu expune un semnal fin-grained de progres
    // pentru încărcarea bundle-ului fără să rescriem manual loader-ul
    // (flutter_bootstrap.js e auto-generat la fiecare `flutter build web`,
    // orice modificare acolo s-ar pierde la următorul build). Se apropie
    // asimptotic de 92% cât timp așteaptă, ca userul să nu vadă niciodată
    // 100% înainte ca aplicația chiar să fie gata - finalizarea reală tot
    // vine din "flutter-first-frame" / timeout, ca înainte, neschimbat.
    (function () {
      var percentEl = document.getElementById('splash-percent');
      var stageEl = document.getElementById('splash-stage');
      var ringFg = document.getElementById('splash-ring-fg');
      var circumference = 201.06;
      var current = 0;
      var done = false;

      function setPercent(p) {
        current = p;
        if (percentEl) percentEl.textContent = Math.round(p) + '%';
        if (ringFg) ringFg.style.strokeDashoffset = String(circumference * (1 - p / 100));
        if (stageEl) {
          stageEl.textContent = p < 30
            ? 'Se încarcă aplicația…'
            : p < 70
              ? 'Se pregătesc resursele…'
              : 'Aproape gata…';
        }
      }

      var tickInterval = setInterval(function () {
        if (done) return;
        // Pas care scade pe măsură ce ne apropiem de plafonul de 92% -
        // rapid la început, tot mai lent spre final (curbă ease-out).
        var step = Math.max(0.15, (92 - current) * 0.06);
        setPercent(Math.min(92, current + step));
      }, 60);

      window._splashFinish = function () {
        if (done) return;
        done = true;
        clearInterval(tickInterval);
        setPercent(100);
      };
    })();

    window.addEventListener('flutter-first-frame', function () {
      window._splashFinish && window._splashFinish();
      // Scurtă pauză ca userul să apuce să vadă 100% înainte ca splash-ul
      // să dispară - altfel sare direct de la ~92% la nimic.
      setTimeout(function () {
        document.getElementById('splash')?.remove();
        document.getElementById('seo-content')?.remove();
      }, 150);
    });
    setTimeout(function () {
      window._splashFinish && window._splashFinish();
      document.getElementById('splash')?.remove();
      document.getElementById('seo-content')?.remove();
    }, 15000);

    // Dezînregistrăm orice service worker Flutter deja instalat și golim
    // cache-urile lui. Am avut două runde de bug-uri unde o versiune veche
    // rămânea servită din cache după ce am publicat un fix - inclusiv în
    // incognito, dacă exista o altă fereastră incognito activă. Aplicația
    // nu depinde de service worker pentru funcționare (nu avem mod offline);
    // costul e neglijabil, câștigul e că un release nou intră imediat.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (const r of regs) r.unregister();
      });
      if (typeof caches !== 'undefined') {
        caches.keys().then(function (keys) {
          for (const k of keys) caches.delete(k);
        });
      }
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
