  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon-square.png"
  adaptive_icon_background: "#7C3A1E"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  # Desenul din icon-foreground.png ocupÄƒ ~67% din pÃ¢nzÄƒ, adicÄƒ exact cÃ¢t zona
  # sigurÄƒ a unei iconiÈ›e adaptive Android (72dp din 108dp = 66,7%). La limita
  # aia, mÄƒÈ™tile rotunde ale launcher-elor taie fix pe marginea desenului È™i
  # iconiÈ›a pare umflatÄƒ. Inset-ul o micÈ™oreazÄƒ la ~52% din pÃ¢nzÄƒ, deci rÄƒmÃ¢ne
  # centratÄƒ, cu spaÈ›iu de respiraÈ›ie Ã®n orice formÄƒ de mascÄƒ.
  adaptive_icon_foreground_inset: 12

flutter_native_splash:
  color: "#F8F4EC"
  image: "assets/icon/icon-splash.png"
  android: true
  ios: false
  web: false
  android_12:
    color: "#F8F4EC"
    image: "assets/icon/icon-splash.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # Bundlate local, nu prin `google_fonts` (care le descarcă la runtime de pe
  # fonts.gstatic.com pe web). Fișiere variabile (un singur .ttf acoperă toată
  # plaja de greutăți 100-900) - descărcate din github.com/google/fonts, nu
  # de pe CDN-ul Google Fonts (care servește woff/woff2, nu garantat compatibil
  # cu pipeline-ul de assets Flutter pe toate platformele). Motivul: pe rețele
  # mobile/tab-uri incognito unde fetch-ul runtime la fonts.gstatic.com eșuează
  # sau întârzie, aplicația cădea pe fontul de sistem - metrici de linie
  # diferite față de DM Sans/Playfair Display, ceea ce dezalinia vertical
  # textul din câmpuri chiar și cu `textAlignVertical: TextAlignVertical.center`
  # setat corect (centrarea e relativă la propria linie de text, nu ajută dacă
  # fontul efectiv randat e altul decât cel pentru care a fost gândit padding-ul).
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
